spring.application.name=bff
server.port=8080

# ================== Azure AD (IDaaS) ==================
# Reemplazar 37b48e96-07a8-4047-bb0b-c2d7664a2845 por el Directory (tenant) ID de tu Azure AD
azure.ad.issuer-uri=https://login.microsoftonline.com/37b48e96-07a8-4047-bb0b-c2d7664a2845/v2.0
# Client ID (Application ID) de la App Registration del BFF/API en Azure AD
azure.ad.audience=67efa660-2d73-4c9c-a179-43dcae627878

# ================== URLs internas de los microservicios ==================
# En local: localhost. En AWS: usar el DNS interno/privado de cada instancia EC2
# o el balanceador de carga correspondiente.
services.ms-clientes.url=http://localhost:8081
services.ms-productos.url=http://localhost:8082
services.ms-pedidos.url=http://localhost:8083

logging.level.org.springframework.security=DEBUG
