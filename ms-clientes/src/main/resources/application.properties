spring.application.name=ms-clientes
server.port=8081

# ================== Base de datos cloud (RDS PostgreSQL) ==================
# Reemplazar con el endpoint real de tu instancia RDS una vez creada
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_clientes
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================== Azure AD (IDaaS) - validacion de JWT ==================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/37b48e96-07a8-4047-bb0b-c2d7664a2845/v2.0
